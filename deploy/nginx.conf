# Plateforme RH + relais vers la gateway (même domaine pour le web, RH Connect et la borne de pointage)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    # Imports Excel / CSV (10 Mo + enveloppe multipart) : au-delà de 12 Mo, nginx répond le même JSON que le référentiel (D-I13.h)
    client_max_body_size 12m;
    error_page 413 = @trop_volumineux;
    location @trop_volumineux {
        default_type application/json;
        return 413 '{"code":"FICHIER_TROP_VOLUMINEUX","erreur":"Le fichier dépasse 10 Mo.","message":"Le fichier dépasse 10 Mo."}';
    }

    root /usr/share/nginx/html;
    index index.html;

    # API, authentification et clés JWT
    location ~ ^/(api|oauth2|\.well-known)/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Notifications temps réel (STOMP sur WebSocket)
    location ~ ^/(ws|ws-sockjs)(/|$) {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Application monopage : toute autre route renvoie index.html (ex. /app/pointage, /borne/<jeton>)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# Application
spring.application.name=svc-notification

# Server
server.port=8085

# Kafka Configuration
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Mail Configuration (Configure for production)
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=no-reply@rh.local

# Must match svc-identite-acces app.internal-api.token.
app.internal-api.token=${INTERNAL_API_TOKEN:change-me-internal-token}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# Base des notifications conservées (D-NOT01) : en kit Docker, SPRING_DATASOURCE_URL / USERNAME / PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5444/notification_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Vérification des jetons (API REST et CONNECT STOMP) par la clé publique de svc-identite-acces.
# Kit Docker : SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI / _JWKSETURI = http://gateway:8080 (déjà dans env-commun).
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks

# Rétention : 6 mois (180 jours), purge quotidienne à 03h30 heure de Tunis, par lots
notification.retention-jours=180
notification.purge.cron=0 30 3 * * *
notification.purge.zone=Africa/Tunis
notification.purge.taille-lot=1000

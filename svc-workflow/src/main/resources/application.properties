spring.application.name=svc-workflow
server.port=8087
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024

spring.datasource.url=jdbc:postgresql://localhost:5444/workflow_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=2000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.jpa.properties.jakarta.persistence.query.timeout=5000

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks

spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.auto-startup=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

logging.level.com.hr.workflow=INFO

# Jeton partage des appels de service a service (/internal/**, D-W3-02)
app.internal-api.token=${INTERNAL_API_TOKEN:change-me-internal-token}

# Appels sortants (D-W3-03) : connexion 1 s, lecture 3 s, semaphore 20 vers le referentiel
workflow.referentiel.base-url=${WORKFLOW_REFERENTIEL_BASE_URL:http://localhost:8083}
workflow.referentiel.timeout-connexion-ms=1000
workflow.referentiel.timeout-lecture-ms=3000
workflow.referentiel.max-appels-simultanes=20

workflow.proprietaires.svc-referentiel-rh.base-url=${WORKFLOW_PROPRIETAIRE_REFERENTIEL_BASE_URL:http://localhost:8083}
workflow.proprietaires.svc-presence.base-url=${WORKFLOW_PROPRIETAIRE_PRESENCE_BASE_URL:http://localhost:8086}
workflow.proprietaires.timeout-connexion-ms=1000
workflow.proprietaires.timeout-lecture-ms=3000

# Planificateurs (§ 9.6.6)
spring.task.scheduling.pool.size=4
workflow.outbox.delai-ms=2000
workflow.effets.reprise-cron=0 * * * * *
workflow.echeances.cron=0 * * * * *
workflow.delegations.cron=0 30 0 * * *

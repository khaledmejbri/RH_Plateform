spring.application.name=svc-presence
server.port=8086

server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,image/png
server.compression.min-response-size=1024

spring.datasource.url=jdbc:postgresql://localhost:5444/presence_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=16

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks

spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# HMAC QR — override en prod via env PRESENCE_QR_HMAC_SECRET (jamais committer un secret réel).
# Défaut DEV uniquement (non-prod) : remplacé automatiquement si la variable d'environnement est définie.
presence.qr.hmac-secret=${PRESENCE_QR_HMAC_SECRET:dev-only-presence-qr-hmac-change-me}
presence.qr.validity-days=90
presence.geofence.default-radius-metres=50
presence.geofence.max-accuracy-metres=100
presence.alert.j30-enabled=true
presence.alert.j30-cron=0 0 8 * * *

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

logging.level.com.hr.presence=INFO

# D-P04 : pointage manuel validé par le responsable
presence.manuel.seuil-alerte-mois=3
presence.manuel.anciennete-max-jours=7
presence.referentiel.base-url=http://localhost:8083
# Delais d'attente des appels vers le referentiel (ms) : connexion puis lecture de la reponse
presence.referentiel.timeout-connexion-ms=2000
presence.referentiel.timeout-lecture-ms=3000

# D-P19 : delai de grace des retards (minutes, 0 a 60) ; constante en attendant les Parametres (lot 3)
presence.retard.delai-grace-minutes=0

# D-P06 a D-P10 : reconnaissance faciale (seuil par defaut du reglage, echecs avant blocage, duree du blocage en minutes)
presence.facial.seuil-defaut=92
presence.facial.echecs-max=3
presence.facial.blocage-minutes=15

# D-P13 a D-P16 : heures supplementaires (cron d'expiration des demandes en attente, periode max du comptage / CSV)
presence.heures-sup.expiration-cron=0 */5 * * * *
presence.heures-sup.periode-export-max-jours=93

# Temps de travail par collaborateur (D-P17) : periode maximale (jours) et rattachement apres minuit sur un site sans horaire (heures)
presence.temps-travail.periode-max-jours=31
presence.temps-travail.duree-max-sans-horaire-heures=16

# Appels de service a service vers le referentiel (/internal) : meme jeton partage que les autres services,
# fourni par la variable INTERNAL_API_TOKEN (la valeur par defaut ne sert qu'en developpement local).
app.internal-api.token=${INTERNAL_API_TOKEN:change-me-internal-token}

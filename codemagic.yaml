# Codemagic lit uniquement ce fichier à la racine du dépôt.
# App Flutter : rh_mobile_app (RH Connect).
# Docs : https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# Workflow par défaut = compile iOS SANS profil Apple (pas d’IPA installable).
# Il produit aussi RHConnect-unsigned.ipa, installable sur iPhone depuis Windows
# avec Sideloadly + Apple ID gratuit (re-signature, valable 7 jours).
# Avec un compte Apple Developer : certificat + profil dans Codemagic, puis
# lancer manuellement « RH Connect iOS (signé) ».
# API : modifiable dans l'app (écran de connexion → « Serveur »), ex. URL de tunnel.
#
# Artefacts : chemins absolus via $CM_BUILD_DIR (racine du clone). Avec
# working_directory, un chemin relatif « rh_mobile_app/... » n'est pas trouvé
# (« No artifacts were found » à l'étape Publishing).

workflows:
  rh-connect-ios:
    name: RH Connect iOS
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: rh_mobile_app
    environment:
      flutter: 3.29.2
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: tn.agua.rhconnect
        # Tunnel Cloudflare courant (change à chaque redémarrage : modifiable dans l'app)
        API_BASE_URL: https://possible-interactions-rubber-doctors.trycloudflare.com
    cache:
      cache_paths:
        - $HOME/.pub-cache
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: develop_4
          include: true
          source: true
        - pattern: delivery
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Verifier le modele facial (garde-fou de livraison)
        script: |
          MODELE=assets/models/mobilefacenet.tflite
          SOMME=assets/models/mobilefacenet.sha256
          if [ ! -f "$MODELE" ]; then
            if [ "$MODELE_FACIAL_OBLIGATOIRE" = "true" ]; then
              echo "ERREUR : $MODELE absent alors que MODELE_FACIAL_OBLIGATOIRE=true (voir assets/models/LISEZMOI.md)."
              exit 1
            fi
            echo "AVERTISSEMENT : $MODELE absent : la verification faciale sera indisponible dans ce build."
            exit 0
          fi
          ATTENDU=$(tr -d '[:space:]' < "$SOMME" 2>/dev/null || true)
          if [ -z "$ATTENDU" ] || [ "$ATTENDU" = "A_RENSEIGNER" ]; then
            echo "AVERTISSEMENT : somme SHA-256 attendue non renseignee ($SOMME) : modele non verifie."
            exit 0
          fi
          REEL=$(shasum -a 256 "$MODELE" | cut -d' ' -f1)
          if [ "$REEL" != "$ATTENDU" ]; then
            echo "ERREUR : SHA-256 du modele ($REEL) differente de la valeur attendue ($ATTENDU)."
            exit 1
          fi
          echo "Modele facial verifie (SHA-256 conforme)."
      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install
      - name: Analyze
        script: flutter analyze
        ignore_failure: true
      - name: Unit tests
        script: flutter test
      - name: Build iOS (unsigned — no Apple profile required)
        script: |
          flutter build ios --release --no-codesign \
            --obfuscate --split-debug-info=build/symboles \
            --build-name=1.0.0 \
            --build-number=${BUILD_NUMBER:-$PROJECT_BUILD_NUMBER} \
            --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Package unsigned IPA (Sideloadly / AltStore)
        script: |
          cd build/ios/iphoneos
          rm -rf Payload RHConnect-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry RHConnect-unsigned.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/rh_mobile_app/build/ios/iphoneos/*.ipa
      - $CM_BUILD_DIR/rh_mobile_app/build/ios/iphoneos/*.app
      - $CM_BUILD_DIR/rh_mobile_app/build/symboles/*
      - /tmp/xcodebuild_logs/*.log

  rh-connect-ios-signed:
    name: RH Connect iOS (signé)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: rh_mobile_app
    environment:
      flutter: 3.29.2
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: tn.agua.rhconnect
      vars:
        BUNDLE_ID: tn.agua.rhconnect
        API_BASE_URL: http://127.0.0.1:8080
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Verifier le modele facial (garde-fou de livraison)
        script: |
          MODELE=assets/models/mobilefacenet.tflite
          SOMME=assets/models/mobilefacenet.sha256
          if [ ! -f "$MODELE" ]; then
            if [ "$MODELE_FACIAL_OBLIGATOIRE" = "true" ]; then
              echo "ERREUR : $MODELE absent alors que MODELE_FACIAL_OBLIGATOIRE=true (voir assets/models/LISEZMOI.md)."
              exit 1
            fi
            echo "AVERTISSEMENT : $MODELE absent : la verification faciale sera indisponible dans ce build."
            exit 0
          fi
          ATTENDU=$(tr -d '[:space:]' < "$SOMME" 2>/dev/null || true)
          if [ -z "$ATTENDU" ] || [ "$ATTENDU" = "A_RENSEIGNER" ]; then
            echo "AVERTISSEMENT : somme SHA-256 attendue non renseignee ($SOMME) : modele non verifie."
            exit 0
          fi
          REEL=$(shasum -a 256 "$MODELE" | cut -d' ' -f1)
          if [ "$REEL" != "$ATTENDU" ]; then
            echo "ERREUR : SHA-256 du modele ($REEL) differente de la valeur attendue ($ATTENDU)."
            exit 1
          fi
          echo "Modele facial verifie (SHA-256 conforme)."
      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --obfuscate --split-debug-info=build/symboles \
            --build-name=1.0.0 \
            --build-number=${BUILD_NUMBER:-$PROJECT_BUILD_NUMBER} \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define="API_BASE_URL=$API_BASE_URL"
    artifacts:
      - $CM_BUILD_DIR/rh_mobile_app/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/rh_mobile_app/build/symboles/*
      - /tmp/xcodebuild_logs/*.log

  rh-connect-android:
    name: RH Connect Android (manuel)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: rh_mobile_app
    environment:
      flutter: 3.29.2
      java: 17
      vars:
        # Adresse du serveur de démonstration (deploy/GUIDE_DEPLOIEMENT.md) ; modifiable au lancement du build
        # et depuis l'écran de connexion de l'appli.
        API_BASE_URL: https://sirh-demo.duckdns.org
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/rh_mobile_app/android/local.properties"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Verifier le modele facial (garde-fou de livraison)
        script: |
          MODELE=assets/models/mobilefacenet.tflite
          SOMME=assets/models/mobilefacenet.sha256
          if [ ! -f "$MODELE" ]; then
            if [ "$MODELE_FACIAL_OBLIGATOIRE" = "true" ]; then
              echo "ERREUR : $MODELE absent alors que MODELE_FACIAL_OBLIGATOIRE=true (voir assets/models/LISEZMOI.md)."
              exit 1
            fi
            echo "AVERTISSEMENT : $MODELE absent : la verification faciale sera indisponible dans ce build."
            exit 0
          fi
          ATTENDU=$(tr -d '[:space:]' < "$SOMME" 2>/dev/null || true)
          if [ -z "$ATTENDU" ] || [ "$ATTENDU" = "A_RENSEIGNER" ]; then
            echo "AVERTISSEMENT : somme SHA-256 attendue non renseignee ($SOMME) : modele non verifie."
            exit 0
          fi
          REEL=$(shasum -a 256 "$MODELE" | cut -d' ' -f1)
          if [ "$REEL" != "$ATTENDU" ]; then
            echo "ERREUR : SHA-256 du modele ($REEL) differente de la valeur attendue ($ATTENDU)."
            exit 1
          fi
          echo "Modele facial verifie (SHA-256 conforme)."
      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        script: flutter test
      - name: Build APK
        script: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symboles \
            --dart-define="API_BASE_URL=$API_BASE_URL"
    artifacts:
      - $CM_BUILD_DIR/rh_mobile_app/build/**/outputs/**/*.apk
      - $CM_BUILD_DIR/rh_mobile_app/build/symboles/*
